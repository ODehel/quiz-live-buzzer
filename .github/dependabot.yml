# Mises à jour de version des actions de .github/workflows/ci.yml (décision #97).
# Ne couvre pas : les lib_deps et `platform` de platformio.ini, PlatformIO et gcovr
# (installés par `pip install` dans une étape `run:`), la version de Python, le runner.
# Voir DEBTS.md, « Dépendances flottantes ».
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    cooldown:
      default-days: 7
