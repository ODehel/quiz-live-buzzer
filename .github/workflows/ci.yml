name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PLATFORMIO_VERSION: "6.2.0"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      # L'historique complet est exigé par le scanner SonarQube Cloud sur une pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platformio.ini

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install platformio==${{ env.PLATFORMIO_VERSION }}

      - name: Run native tests
        run: pio test -e native

      - name: Measure the coverage of lib/
        run: |
          pip install --only-binary :all: gcovr==8.8
          gcovr --version
          gcovr --root . --filter 'lib/' --exclude 'test/' \
            --object-directory .pio/build/native \
            --print-summary \
            --json-summary coverage-summary.json \
            --sonarqube coverage-sonar.xml --sonarqube-metric line \
            --fail-under-line 96 || status=$?
          line_percent=$(jq '.line_percent' coverage-summary.json)
          echo "Taux de couverture des lignes de lib/ : ${line_percent} % (seuil : 96 %)" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${status:-0}"

      # Un `if` ne lit pas `secrets` : cette étape le lit dans son `env` et publie un booléen.
      - name: SonarQube Cloud token available
        id: sonar-token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SONAR_TOKEN is empty (pull request from a fork or from Dependabot, or secret not set yet): the SonarQube Cloud analysis is skipped."
          fi

      # Informatif (décision #95) : aucune étape qui échoue à cause de Sonar, pas de `sonar.qualitygate.wait`.
      - name: Analyse with SonarQube Cloud
        if: steps.sonar-token.outputs.present == 'true' && github.event.pull_request.head.repo.fork != true
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  esp32-build:
    runs-on: ubuntu-26.04
    # Premier run à froid : toolchain espressif32, framework Arduino et bibliothèques à télécharger.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platformio.ini

      # Préfixe propre à ce job : native-tests ne partage pas sa clé (la toolchain esp32 pèse 2 294 Mo).
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.platformio
          key: pio-esp32-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-esp32-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install platformio==${{ env.PLATFORMIO_VERSION }}

      # src/secrets.h est ignoré par git (identifiants réels) mais main.cpp l'inclut : on le tire du modèle,
      # dont les valeurs sont factices. Le build n'embarque donc aucun secret réel et ne peut pas se connecter.
      - name: Create secrets.h from the dummy template
        run: cp src/secrets.h.example src/secrets.h

      - name: Build the esp32 environment
        run: pio run -e esp32
