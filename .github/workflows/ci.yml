name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platformio.ini

      - uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Run native tests
        run: pio test -e native

      - name: Measure the coverage of lib/
        run: |
          pip install gcovr==8.8
          gcovr --version
          gcovr --root . --filter 'lib/' --exclude 'test/' \
            --object-directory .pio/build/native \
            --print-summary \
            --json-summary coverage-summary.json \
            --fail-under-line 96 || status=$?
          line_percent=$(jq '.line_percent' coverage-summary.json)
          echo "Taux de couverture des lignes de lib/ : ${line_percent} % (seuil : 96 %)" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${status:-0}"
