# Analyse SonarQube Cloud du firmware, informative (décision #95). Lancée par la CI dans `native-tests`, après la mesure de couverture.
sonar.organization=odehel
sonar.projectKey=ODehel_quiz-live-buzzer

# Trois dossiers disjoints : la production (`lib/`, logique ; `src/`, adaptateurs Arduino) et les tests (`test/`). Aucune exclusion.
sonar.sources=lib,src
sonar.tests=test

# Écrit par l'étape « Measure the coverage of lib/ » (gcovr --sonarqube, format générique, lignes de `lib/` seulement).
sonar.coverageReportPaths=coverage-sonar.xml
