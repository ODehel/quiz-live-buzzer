[env]
build_flags = -Werror=switch
extra_scripts = pre:scripts/compiler-warnings.py
lib_deps = bblanchon/ArduinoJson@^7.4.3

[env:native]
; Même dialecte que l'env esp32. Sans ce drapeau, le standard est celui du compilateur : gnu++14 pour GCC 10
; (PC Windows), alors que le code (std::optional, std::variant) et googletest 1.17 exigent C++17.
platform = native
test_framework = googletest
build_flags =
    ${env.build_flags}
    --coverage
    -lgcov
    -O0
    -std=gnu++17

[env:esp32]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_unflags = -std=gnu++11
board_build.arduino.memory_type = qio_opi
lib_deps =
    ${env.lib_deps}
    links2004/WebSockets@^2.7.3
    tamctec/TAMC_GT911@1.0.2
    https://github.com/lovyan03/LovyanGFX.git#1.3.0
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -std=gnu++17
